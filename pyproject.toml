[project]
name = "agentic-rag"
version = "0.1.0"
description = "A stateful RAG workflow for retrieval, answer validation, and iterative refinement."
readme = "README.md"
authors = [
    { name = "satyampandya" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "rag-ingestion>=0.1.0",
    "rag-search-kit>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic_rag"